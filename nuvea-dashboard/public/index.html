<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvéa Monde</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* Plein écran : la ville occupe toute la fenêtre, quatre panneaux flottent par-dessus
   (résumé en haut à gauche, carte à droite, aide en bas à gauche, outils en bas à droite).
   Palette Claude : crème, orange, terre cuite, gris chaud. Un seul look clair, assumé. */
:root{
  color-scheme:light;
  --bg:#F4F1EA; --panel:rgba(255,253,249,.94); --solid:#FFFDF9; --fg:#1F1E1D; --muted:#6F6A61; --line:#E6DFD2;
  --accent:#D97757; --accent-strong:#B9583A; --accent-soft:#FBEDE6; --alert:#C8442F; --alert-soft:#FCE9E4;
  --ok:#4F7A4A; --morning:#3F7FC1; --noon:#D9583C; --evening:#4E9A62;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-display:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
#app{position:relative;height:100%;background:radial-gradient(130% 100% at 50% 0%,#FBF4EC 0%,#EFE8DC 70%);transition:background 1s}
#app.night{background:radial-gradient(130% 100% at 50% 0%,#3A3330 0%,#211E1C 75%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl.over{cursor:pointer}#gl.drag{cursor:grabbing}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 28px rgba(60,40,25,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Résumé */
#summary{left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:12px 14px;max-width:min(470px,calc(100% - 28px))}
.s-head{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.s-dot{width:9px;height:9px;border-radius:2px;background:var(--accent)}
.s-range{color:var(--muted);font-size:11.5px;margin:1px 0 9px 16px}
.s-kpis{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.s-kpi{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--solid);min-width:0}
.s-kpi .l{font-size:10.5px;color:var(--muted);white-space:nowrap}
.s-kpi .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-kpi .v.alert{color:var(--alert)}
.s-live{font-size:11px;color:var(--muted);margin:8px 0 0}
.s-live b{color:var(--ok);font-weight:600}

/* Barre du haut à droite */
#top{right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:5px;align-items:center}
#pickEl{border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:5px 8px;font-size:12.5px;max-width:180px}
.seg{display:flex;background:#EFE9DE;border-radius:8px;padding:2px}
.seg button{border:0;background:none;font-size:12px;padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Carte de statistiques */
#card{right:max(14px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));
  width:min(330px,calc(100% - 28px));padding:16px;overflow:auto;opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .25s,transform .25s}
#card.open{opacity:1;transform:none;pointer-events:auto}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong);font-weight:600}
#card h2{font:600 1.35rem/1.15 var(--f-display);margin:3px 30px 2px 0}
.c-range{font-size:11.5px;color:var(--muted);margin:0 0 12px}
#close{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--solid);cursor:pointer;font-size:15px;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.st{background:var(--solid);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
.st dt{font-size:11px;color:var(--muted)}
.st dd{margin:1px 0 0;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.st dd small{font-size:.75rem;color:var(--muted);font-weight:500;margin-left:2px}
.st dd.txt{font-size:.95rem;padding-top:3px}
.st .sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.sec{margin-top:14px}
.sec h3{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.spark{width:100%;height:64px;display:block}
.spark-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
.lines{font-size:12.5px;margin:6px 0 0;padding:0;list-style:none}
.lines li{margin:2px 0}
.txtsec{font-size:12.5px;color:var(--fg);margin:0}
.alertbox{background:var(--alert-soft);border-radius:9px;padding:9px 11px;font-size:12.5px}
.alertbox h3{color:var(--alert)}
.alertbox ul{margin:0;padding-left:16px}
.next{margin-top:12px;background:var(--accent-soft);border-radius:9px;padding:9px 11px;font-size:12.5px}

/* Aide et légende */
#help{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:7px 11px;font-size:11.5px;color:var(--muted);max-width:calc(100% - 200px)}
#help b{color:var(--fg);font-weight:600}
.lg{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}

/* Outils */
#tools{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:3px;padding:4px}
#tools button{width:32px;height:30px;border:0;background:none;border-radius:7px;cursor:pointer;font-size:15px}
#tools button:hover{background:#EFE9DE}

/* Infobulle */
#tip{position:absolute;pointer-events:none;background:#2A2724;color:#FBF6EF;font-size:11.5px;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(12px,-120%);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}#tip span{opacity:.7;margin-left:6px}

#err{left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:8px 12px;background:var(--alert-soft);color:var(--alert);font-size:12.5px}

@media (max-width:760px){
  #summary{padding:10px}
  .s-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #top{top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  #card{top:auto;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:62%}
  #help{display:none}
}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Ville 3D de Nuvéa. Le menu « Tous les éléments » ouvre les mêmes cartes au clavier."></canvas>

  <section class="panel" id="summary" aria-label="Résumé des 30 derniers jours">
    <div class="s-head"><span class="s-dot"></span>Nuvéa · 30 derniers jours</div>
    <div class="s-range" id="s-range">Lecture de Stripe…</div>
    <div class="s-kpis">
      <div class="s-kpi"><div class="l">Chiffre d'affaires</div><div class="v" id="k-ca">—</div></div>
      <div class="s-kpi"><div class="l">Clients</div><div class="v" id="k-cl">—</div></div>
      <div class="s-kpi"><div class="l">Panier moyen</div><div class="v" id="k-avg">—</div></div>
      <div class="s-kpi"><div class="l">Alertes</div><div class="v alert" id="k-al">—</div></div>
    </div>
    <p class="s-live" id="s-live"></p>
  </section>

  <div class="panel" id="top">
    <label for="pickEl" class="sr" hidden>Élément</label>
    <select id="pickEl" aria-label="Ouvrir la carte d'un élément"><option value="">Tous les éléments</option></select>
    <div class="seg" role="group" aria-label="Lumière">
      <button data-light="auto" aria-pressed="true">Auto</button>
      <button data-light="day" aria-pressed="false">Jour</button>
      <button data-light="night" aria-pressed="false">Soir</button>
    </div>
  </div>

  <section class="panel" id="card" aria-live="polite">
    <button id="close" aria-label="Fermer la carte">×</button>
    <div class="eyebrow" id="c-eye"></div>
    <h2 id="c-title"></h2>
    <p class="c-range" id="c-range"></p>
    <dl class="grid" id="c-stats"></dl>
    <div id="c-extra"></div>
  </section>

  <div class="panel" id="help">
    <div><b>Glisser</b> tourner · <b>Clic droit</b> déplacer · <b>Molette</b> zoomer · <b>Clic</b> statistiques</div>
    <div class="lg">Clients : <span><i style="background:var(--morning)"></i>matin</span><span><i style="background:var(--noon)"></i>midi</span><span><i style="background:var(--evening)"></i>après-midi</span></div>
  </div>

  <div class="panel" id="tools" role="group" aria-label="Caméra">
    <button id="rotL" aria-label="Tourner à gauche">⟲</button>
    <button id="rotR" aria-label="Tourner à droite">⟳</button>
    <button id="zout" aria-label="Dézoomer">−</button>
    <button id="zin" aria-label="Zoomer">+</button>
    <button id="home" aria-label="Recentrer">⌂</button>
  </div>

  <div id="tip"></div>
  <div class="panel" id="err" role="alert" hidden></div>
</div>

<script>
/* =====================================================================
   DONNÉES  —  /api/stats (Stripe, lecture seule), relu toutes les minutes
   ===================================================================== */
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nf = (n, d) => Number(n).toLocaleString("fr-FR", {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
let CUR = "€";
const money = v => `${nf(v, v % 1 ? 2 : 0)} ${CUR}`;
const dShort = iso => new Date(iso + (iso.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
const dLong = iso => new Date(iso + (iso.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"short"});
const SNAP = "Hors Stripe : relevé du 12 nov. 2026.";
let DATA = null, ITEMS = {}, selected = null;

function curSymbol(c){
  if (!c) return "€";
  try { return (0).toLocaleString("fr-FR",{style:"currency",currency:c.toUpperCase(),maximumFractionDigits:0}).replace(/[\d\s ,.]/g,"") || c.toUpperCase(); }
  catch { return c.toUpperCase(); }
}
const N = (label, n, unit, sub) => ({label, n:n||0, unit:unit||"", sub});
const T = (label, text, sub) => ({label, text, sub});

function buildItems(d){
  const ch = d.charges.ok ? d.charges : null, pi = d.intents.ok ? d.intents : null,
        se = d.sessions.ok ? d.sessions : null, pr = d.products.ok ? d.products : null,
        ba = d.balance.ok ? d.balance : null, ac = d.account.ok ? d.account : null;
  CUR = curSymbol((ch && ch.currency) || (ba && ba.currency) || (ac && ac.currency));
  const err = s => s && !s.ok ? `Stripe : ${s.error}.` : null;
  const enCours = (ch ? ch.pending : 0) + (pi ? pi.inProgress : 0);
  const perDay = ch ? ch.gross / 30 : 0;
  const top = se ? se.top : [];
  const formation = top.find(p => /formation|trading/i.test(p.name));
  const bestLines = ch && ch.best
    ? [`Meilleur jour : ${dLong(ch.best.date)}, ${money(ch.best.amount)}`, `Jour le plus calme : ${dLong(ch.calm.date)}, ${money(ch.calm.amount)}`]
    : ["Aucune vente sur la période : pas encore de meilleur jour."];
  const cmdText = pi || ch ? (enCours ? `${enCours} paiement(s) en traitement ou à valider dans Stripe.` : "Aucun paiement en traitement ni à valider dans Stripe.") : "Non lu.";

  const it = {
    overview:{eyebrow:"Vue d'ensemble", name:"La boutique Nuvéa", range:true, status: ch ? "ok" : "wait",
      stats:[N("Chiffre d'affaires",ch&&ch.gross,CUR,`≈ ${money(perDay)} par jour`), N("Clients",ch&&ch.customers,"",`≈ ${nf((ch?ch.customers:0)/30,1)} par jour`),
        ch && ch.avg !== null ? N("Panier moyen",ch.avg,CUR) : T("Panier moyen","—","Aucune vente à diviser"), N("Commandes en cours",enCours)],
      spark:true, lines:bestLines, sections:[{title:"Commandes en cours", text:cmdText}],
      note: err(d.charges) || "Toutes tes ventes Stripe des 30 derniers jours, heure de Paris."},
    tower:{eyebrow:"Produit", name:"Formation Trading IA", range:true, status: se ? "ok" : "wait",
      stats:[N("Chiffre d'affaires",formation&&formation.revenue,CUR), N("Ventes",formation&&formation.qty),
        T("Stock","Illimité","Produit digital"), N("Part du CA",formation && ch && ch.gross ? Math.round(formation.revenue/ch.gross*100) : 0,"%")],
      sections:[{title:"Comment c'est compté", text: formation ? `Ventes Checkout du produit « ${formation.name} ».` : "Aucune vente Checkout d'un produit nommé « formation » ou « trading » sur 30 jours."}],
      note: err(d.sessions)},
    shelves:{eyebrow:"Étagères", name:"Packs digitaux", range:true, status: pr ? "ok" : "wait",
      stats:[N("Produits actifs",pr&&pr.active), N("Ventes Checkout",se&&se.completed),
        pr && pr.stock !== null ? N("Stock suivi",pr.stock,"","metadata.stock") : T("Stock","Illimité","Produits digitaux"),
        N("CA du n°1",top[0]&&top[0].revenue,CUR)],
      sections:[{title:"Produits les plus vendus", items: top.length ? top.map(p => `${p.name} · ${p.qty} vendu${p.qty>1?"s":""} · ${money(p.revenue)}`) : ["Aucune vente sur 30 jours."]}],
      alerts: pr && pr.active === 0 ? ["Aucun produit actif dans Stripe : tes packs n'y sont pas encore créés."] : [],
      note: err(d.products)},
    counter:{eyebrow:"Comptoir", name:"Caisse Stripe", range:false, status: ac && ac.charges_enabled ? "ok" : "wait",
      stats:[N("Solde disponible",ba&&ba.available,CUR), N("Solde en attente",ba&&ba.pending,CUR),
        N("Remboursé (30 j)",ch&&ch.refunded,CUR), T("Paiements", ac ? (ac.charges_enabled ? "Activés" : "À activer") : "—", ac ? (ac.payouts_enabled ? "Virements activés" : "Virements bloqués") : "")],
      sections:[{title:"Compte", text: ac ? ac.name : "Non lu"}],
      alerts: ac && !ac.charges_enabled ? ["Paiements Stripe pas encore activés."] : [],
      note: err(d.balance) || err(d.account)},
    clients:{eyebrow:"Clients", name:"Les clients", range:true, status: ch ? "ok" : "wait",
      stats:[N("Matin",ch&&ch.moments.matin,"","avant 12 h"), N("Midi",ch&&ch.moments.midi,"","12 h – 14 h"),
        N("Après-midi",ch&&ch.moments.soir,"","après 14 h"), ch && ch.avg !== null ? N("Panier moyen",ch.avg,CUR) : T("Panier moyen","—")],
      sections:[{title:"Total", text: ch ? `${ch.customers} client${ch.customers>1?"s":""} unique${ch.customers>1?"s":""}, ${ch.count} paiement${ch.count>1?"s":""}.` : "Non lu."},
                {title:"Dans la ville", text: ch && ch.customers ? "Chaque personnage représente un client, coloré selon l'heure de son achat." : "Les silhouettes grises devant la boutique sont des places vides : aucun client sur 30 jours."}],
      note: err(d.charges)},
    trucks:{eyebrow:"Livraisons", name:"Les camionnettes", range:true, status: se || ch ? "ok" : "wait",
      stats:[N("Livrées",se ? se.completed : ch && ch.count,"","accès envoyés"), N("En cours",enCours),
        N("Paiements échoués",ch&&ch.failed), N("Paiements abandonnés",pi&&pi.abandoned)],
      sections:[{title:"Comment c'est compté", text:"Une livraison = une session de paiement Checkout terminée."}],
      note: err(d.sessions)},
    shop:{eyebrow:"Vitrine", name:"Pages de paiement", range:true, status: se ? "ok" : "wait",
      stats:[N("Ouvertes",se&&se.created), N("Terminées",se&&se.completed),
        N("Conversion",se && se.created ? Math.round(se.completed/se.created*100) : 0,"%"), N("Expirées",se&&se.expired)],
      sections:[{title:"À savoir", text:"Compte les pages de paiement Stripe, pas les visites de ta page de vente systeme.io."}],
      note: err(d.sessions)},
    studio:{eyebrow:"Contenu", name:"Studio vidéo", range:false, status:"off",
      stats:[N("Docs scripts et prompts",3), T("Dernier modifié","11 nov."), N("Vidéos analysées",0), T("Vues mesurées","Non accessibles")],
      sections:[{title:"Source", text:"Google Drive : « TIA - Scripts… », « TIA - Prompts offerts », « prompt video »."}], note:SNAP},
    tiktok:{eyebrow:"Audience", name:"Antenne TikTok", range:false, status:"off",
      stats:[N("Comptes publicitaires",0), N("Business Centers",0), N("Dépense pub",0,"€"), T("Vues organiques","Non accessibles")],
      alerts:["Aucun compte publicitaire TikTok relié."], note:SNAP},
    funnel:{eyebrow:"Tunnel", name:"Porte systeme.io", range:false, status:"off",
      stats:[T("Entrées","Non lu"), N("Docs de configuration",1), T("Connexion","Aucune"), T("Source","Drive")],
      sections:[{title:"Pour l'ajouter", text:"Exporte les statistiques du tunnel en CSV et envoie-les moi."}], note:SNAP},
    mail:{eyebrow:"Courrier", name:"Boîte mail", range:false, status:"off",
      stats:[N("Emails de commande",0), N("Emails Stripe récents",2), T("Fournisseurs","DSers, CJ, AliExpress"), N("Période lue",30,"j")],
      note:SNAP}
  };
  return it;
}
const ORDER = ["overview","tower","shelves","counter","clients","trucks","shop","studio","tiktok","funnel","mail"];

/* ---------- Comptage animé ---------- */
const shown = new WeakMap(); let raf = 0;
function countUp(targets){
  cancelAnimationFrame(raf);
  const dec = t => (t.to % 1 ? 2 : 0);
  if (reduce){ targets.forEach(t => { t.el.textContent = nf(t.to, dec(t)); shown.set(t.el, t.to); }); return; }
  targets.forEach(t => t.from = shown.get(t.el) ?? 0);
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - p, 3);
    targets.forEach(t => { const v = t.from + (t.to - t.from) * e; t.el.textContent = nf(v, p < 1 ? 0 : dec(t)); shown.set(t.el, v); });
    if (p < 1) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

/* ---------- Courbe du CA par jour ---------- */
function sparkline(days){
  const W = 300, H = 64, max = Math.max(1, ...days.map(d => d.amount));
  const pts = days.map((d, i) => [i/(days.length-1)*W, H - 6 - d.amount/max*(H-14)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Chiffre d'affaires par jour">
    <line x1="0" y1="${H-6}" x2="${W}" y2="${H-6}" stroke="#E6DFD2" stroke-width="1"/>
    <path d="${line} L ${W} ${H-6} L 0 ${H-6} Z" fill="#D97757" fill-opacity=".14"/>
    <path d="${line}" fill="none" stroke="#D97757" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#B9583A"/></svg>
    <div class="spark-axis"><span>${dShort(days[0].date)}</span><span>max ${money(Math.max(0,...days.map(d=>d.amount)))}</span><span>${dShort(days[days.length-1].date)}</span></div>`;
}

/* ---------- Carte ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function rangeText(){
  if (!DATA) return "";
  const a = new Date(DATA.periodStart), b = new Date(DATA.fetchedAt);
  const f = x => x.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"short"});
  return `${f(a)} → ${f(b)} · 30 jours`;
}
function openCard(id, keep){
  const it = ITEMS[id]; if (!it) return; selected = id;
  $("c-eye").textContent = it.eyebrow;
  $("c-title").textContent = it.name;
  $("c-range").textContent = it.range ? rangeText() : (it.note === SNAP ? "Relevé du 12 nov. 2026" : "En direct depuis Stripe");
  const dl = $("c-stats"), prev = keep ? [...dl.querySelectorAll("dd > span")] : [];
  dl.innerHTML = ""; const targets = [];
  it.stats.forEach(s => {
    const box = document.createElement("div"); box.className = "st";
    const dt = document.createElement("dt"); dt.textContent = s.label;
    const dd = document.createElement("dd");
    if (s.text !== undefined){ dd.textContent = s.text; dd.className = "txt"; }
    else {
      const num = document.createElement("span"); const old = prev.shift();
      num.textContent = old ? old.textContent : "0"; shown.set(num, old ? (shown.get(old) ?? 0) : 0);
      dd.appendChild(num);

  const total = m.matin + m.midi + m.soir;
  if (!total){
    for (let i = 0; i < 4; i++){ const p = person(0, true); p.position.set(1 + i*.8, 0, 6.4); p.userData = {ghost:true, ph:i}; people.push(p); clientG.add(p); }
  } else {
    const n = Math.min(total, 30), list = [];
    ["matin","midi","soir"].forEach(k => { for (let i = 0; i < Math.round(m[k] / total * n); i++) list.push(k); });
    list.forEach((k, i) => { const p = person(MOMENT_COL[k]); p.userData = {ph:i / list.length, lane:(i % 3 - 1) * .5}; people.push(p); clientG.add(p); });
  }
  reg("clients", clientG);
}

/* --- Alertes : triangle rouge au-dessus des éléments concernés --- */
function alertTex(){
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  x.fillStyle = "#C8442F"; x.beginPath(); x.moveTo(64, 10); x.lineTo(120, 112); x.lineTo(8, 112); x.closePath(); x.fill();
  x.fillStyle = "#fff"; x.font = "bold 70px Arial"; x.textAlign = "center"; x.fillText("!", 64, 102);
  return new THREE.CanvasTexture(c);
}
const ALERT_MAT = new THREE.SpriteMaterial({map:alertTex(), depthTest:false});
const ALERT_AT = {shelves:[-4.05,3.4,.1], counter:[-1.4,2.4,-2.8], tiktok:[-17.2,7.6,-3.8], overview:[0,4.6,-.6]};
function updateAlerts(){
  for (const id in ALERT_AT){
    const has = ITEMS[id] && ITEMS[id].alerts && ITEMS[id].alerts.length;
    if (has && !markers[id]){ const s = new THREE.Sprite(ALERT_MAT); s.scale.set(.9, .9, .9); s.position.set(...ALERT_AT[id]); s.renderOrder = 10; scene.add(s); markers[id] = s; }
    if (!has && markers[id]){ scene.remove(markers[id]); delete markers[id]; }
  }
}
function updateWorld(d){ buildClients(d); updateAlerts(); }

/* =====================================================================
   LUMIÈRE : jour / soir, et allumage progressif au chargement
   ===================================================================== */
let lightMode = "auto";
const parisHour = () => +new Intl.DateTimeFormat("fr-FR", {timeZone:"Europe/Paris", hour:"2-digit", hourCycle:"h23"}).format(new Date());
const isNight = () => lightMode === "night" || (lightMode === "auto" && (parisHour() >= 19 || parisHour() < 7));
document.querySelectorAll("[data-light]").forEach(b => b.onclick = () => {
  lightMode = b.dataset.light;
  document.querySelectorAll("[data-light]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});
const ORDER_LIGHT = ["overview","counter","shelves","tower","studio"];
const hl = new THREE.Color(0xD97757);
let nightK = isNight() ? 1 : 0;
function paint(t, dt){
  const target = isNight() ? 1 : 0;
  nightK += (target - nightK) * Math.min(1, dt * 2.5);
  $("app").classList.toggle("night", target === 1);
  hemi.intensity = .5 - .3*nightK; sun.intensity = .78 - .55*nightK;
  hemi.color.setRGB(1, .965 - .1*nightK, .925 - .05*nightK);
  // fenêtres des bâtiments à toi : s'allument l'une après l'autre au chargement
  ORDER_LIGHT.forEach((id, i) => {
    const on = reduce ? 1 : Math.max(0, Math.min(1, (t - .5 - i*.35) / .6));
    const status = ITEMS[id] ? ITEMS[id].status : "off";
    const base = status === "off" ? .15 : status === "wait" ? .55 : 1;
    const k = on * base * (.35 + .65*nightK) * (reduce ? 1 : .93 + .07*Math.sin(t*1.4 + i));
    (glowMats[id] || []).forEach(m => m.emissive.setRGB(1*k, .7*k, .42*k));
  });
  houseWins.forEach((m, i) => { const k = nightK * ((i * 7) % 5 > 1 ? .75 : .1); m.emissive.setRGB(.95*k, .68*k, .4*k); });
  lampMats.forEach((m, i) => { const k = Math.max(nightK, reduce ? 0 : Math.min(.35, Math.max(0, t - .3 - i*.12))); m.emissive.setRGB(1*k, .75*k, .45*k); });
  // surbrillance
  pick.forEach(m => {
    if (m.material.emissive === undefined || (glowMats[m.userData.id] || []).includes(m.material) || lampMats.includes(m.material)) return;
    const on = m.userData.id === selected, hov = m.userData.id === hovered;
    if (on) m.material.emissive.copy(hl).multiplyScalar(.28 * (reduce ? 1 : .75 + .25*Math.sin(t*3)));
    else if (hov) m.material.emissive.copy(hl).multiplyScalar(.14);
    else m.material.emissive.setRGB(0, 0, 0);
  });
  for (const id in markers) markers[id].position.y = ALERT_AT[id][1] + (reduce ? 0 : Math.sin(t*2.4)*.15);
}

/* =====================================================================
   CAMÉRA, INTERACTION, BOUCLE
   ===================================================================== */
function resize(){
  const w = innerWidth, h = innerHeight, half = w < 700 ? 19 : 15, a = w / h;
  renderer.setSize(w, h, false);
  cam.left = -half*a; cam.right = half*a; cam.top = half; cam.bottom = -half; cam.updateProjectionMatrix();
}
addEventListener("resize", resize);
let camAnim = null;
function tween(target, zoom, pos){
  const to = {t:target.clone(), z:zoom, p:pos ? pos.clone() : null};
  if (reduce){ controls.target.copy(to.t); cam.zoom = to.z; if (to.p) cam.position.copy(to.p); cam.updateProjectionMatrix(); return; }
  camAnim = {t0:performance.now(), fT:controls.target.clone(), fZ:cam.zoom, fP:cam.position.clone(), ...to};
}
function focusOn(id){
  const g = groups[id]; if (!g || id === "trucks" || id === "clients") return;
  const c = new THREE.Box3().setFromObject(g).getCenter(new THREE.Vector3());
  tween(c, Math.max(cam.zoom, 1.9), c.clone().add(cam.position.clone().sub(controls.target)));
}
function orbit(angle){
  const off = cam.position.clone().sub(controls.target); off.applyAxisAngle(new THREE.Vector3(0,1,0), angle);
  tween(controls.target, cam.zoom, controls.target.clone().add(off));
}
$("rotL").onclick = () => orbit(Math.PI/4);
$("rotR").onclick = () => orbit(-Math.PI/4);
$("zin").onclick = () => tween(controls.target, Math.min(controls.maxZoom, cam.zoom*1.3));
$("zout").onclick = () => tween(controls.target, Math.max(controls.minZoom, cam.zoom/1.3));
$("home").onclick = () => { closeCard(); tween(HOME.target, HOME.zoom, HOME.pos); };

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), tip = $("tip");
let hovered = null, down = null;
function hit(e){
  ptr.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(ptr, cam);
  const h = ray.intersectObjects(pick, false)[0]; return h ? h.object.userData.id : null;
}
canvas.addEventListener("pointerdown", e => { down = {x:e.clientX, y:e.clientY, b:e.button}; canvas.classList.add("drag"); tip.classList.remove("on"); });
canvas.addEventListener("pointermove", e => {
  if (down) return;
  const id = hit(e); hovered = id; canvas.classList.toggle("over", !!id);
  if (id && ITEMS[id] && ITEMS[id].name){ tip.innerHTML = `${esc(ITEMS[id].name)}<span>${esc(ITEMS[id].eyebrow)}</span>`; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("on"); }
  else tip.classList.remove("on");
});
canvas.addEventListener("pointerup", e => {
  canvas.classList.remove("drag");
  if (down && down.b === 0 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6){ const id = hit(e); id ? openCard(id) : closeCard(); }
  down = null;
});
canvas.addEventListener("pointerleave", () => { hovered = null; tip.classList.remove("on"); });
canvas.addEventListener("contextmenu", e => e.preventDefault());

// trajet des camionnettes : boucle sur les rues, voie de droite
const LANE = .65, A0 = ST[0] + LANE, A1 = ST[1] - LANE, loop = [[A0, A0],[A1, A0],[A1, A1],[A0, A1]];
const seg = loop.map((p, i) => { const q = loop[(i+1)%4]; return Math.hypot(q[0]-p[0], q[1]-p[1]); }), tot = seg.reduce((a,b)=>a+b, 0);
function onLoop(u){
  let d = ((u % 1) + 1) % 1 * tot, i = 0; while (d > seg[i]){ d -= seg[i]; i++; }
  const p = loop[i], q = loop[(i+1)%4], f = d/seg[i];
  return {x:p[0] + (q[0]-p[0])*f, z:p[1] + (q[1]-p[1])*f, a:Math.atan2(-(q[1]-p[1]), q[0]-p[0])};
}
// chemin des clients : du trottoir vers la porte de la boutique
const path = [[9, 9.8], [5, 7.6], [2.6, 3.2]];
function onPath(u){ const k = u * 2, i = Math.min(1, Math.floor(k)), f = k - i, a = path[i], b = path[i+1]; return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f, Math.atan2(-(b[1]-a[1]), b[0]-a[0])]; }

let last = performance.now(); const t0 = last;
function frame(now){
  const t = (now - t0)/1000, dt = Math.min(.1, (now - last)/1000); last = now;
  if (camAnim){
    const p = Math.min(1, (now - camAnim.t0)/750), e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    controls.target.lerpVectors(camAnim.fT, camAnim.t, e);
    cam.zoom = camAnim.fZ + (camAnim.z - camAnim.fZ)*e; cam.updateProjectionMatrix();
    if (camAnim.p) cam.position.lerpVectors(camAnim.fP, camAnim.p, e);
    if (p >= 1) camAnim = null;
  }
  trucks.forEach(tr => { const s = onLoop((reduce ? 0 : t*.018) + tr.userData.offset); tr.position.set(s.x, reduce ? 0 : Math.abs(Math.sin(t*10 + tr.userData.offset*9))*.02, s.z); tr.rotation.y = s.a; });
  people.forEach(p => {
    if (p.userData.ghost){ p.position.y = reduce ? 0 : Math.abs(Math.sin(t*1.4 + p.userData.ph))*.04; return; }
    const u = reduce ? p.userData.ph : (t*.04 + p.userData.ph) % 1, [x, z, a] = onPath(u);
    p.position.set(x + p.userData.lane, reduce ? 0 : Math.abs(Math.sin(t*6 + p.userData.ph*20))*.06, z); p.rotation.y = a;
  });
  paint(t, dt);
  controls.update();
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

ITEMS = Object.fromEntries(ORDER.map(id => [id, {status:"off"}]));
buildClients(null);
resize(); cam.updateProjectionMatrix();
requestAnimationFrame(frame);
refresh(); setInterval(refresh, 60000);
</script>
