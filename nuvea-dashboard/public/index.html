<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvéa Monde</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<style>
/* Plein écran : la ville remplit la fenêtre, quatre panneaux flottent par-dessus.
   Palette Claude : crème, orange, terre cuite, gris chaud. Look clair assumé, le soir assombrit la scène. */
:root{
  color-scheme:light;
  --bg:#F4F1EA; --panel:rgba(255,253,249,.95); --solid:#FFFDF9; --fg:#1F1E1D; --muted:#6F6A61; --line:#E6DFD2;
  --accent:#D97757; --accent-strong:#B9583A; --accent-soft:#FBEDE6; --alert:#C8442F; --alert-soft:#FCE9E4;
  --ok:#4F7A4A; --morning:#3F7FC1; --noon:#D9583C; --evening:#4E9A62;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-display:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
#app{position:relative;height:100%;background:linear-gradient(180deg,#F6EEE3 0%,#EDE4D6 100%)}
#app.night{background:linear-gradient(180deg,#2B2A33 0%,#1C1B20 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl.over{cursor:pointer}#gl.drag{cursor:grabbing}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 28px rgba(60,40,25,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#summary{left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:12px 14px;max-width:min(480px,calc(100% - 28px))}
.s-head{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.s-dot{width:9px;height:9px;border-radius:2px;background:var(--accent)}
.s-range{color:var(--muted);font-size:11.5px;margin:1px 0 9px 16px}
.s-kpis{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.s-kpi{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--solid);min-width:0}
.s-kpi .l{font-size:10.5px;color:var(--muted);white-space:nowrap}
.s-kpi .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-kpi .v.alert{color:var(--alert)}
.s-perso{margin:8px 0 0;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;border-top:1px dashed var(--line);padding-top:7px}
.s-perso b{font-variant-numeric:tabular-nums}
.s-live{font-size:11px;color:var(--muted);margin:6px 0 0}

#top{right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:5px;align-items:center}
#pickEl{border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:5px 8px;font-size:12.5px;max-width:190px}
.seg{display:flex;background:#EFE9DE;border-radius:8px;padding:2px}
.seg button{border:0;background:none;font-size:12px;padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

#card{right:max(14px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));
  width:min(350px,calc(100% - 28px));padding:16px;overflow:auto;opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .25s,transform .25s}
#card.open{opacity:1;transform:none;pointer-events:auto}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong);font-weight:600}
#card h2{font:600 1.35rem/1.15 var(--f-display);margin:3px 30px 2px 0}
.c-range{font-size:11.5px;color:var(--muted);margin:0 0 12px}
#close{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--solid);cursor:pointer;font-size:15px;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.st{background:var(--solid);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
.st dt{font-size:11px;color:var(--muted)}
.st dd{margin:1px 0 0;font-weight:700;font-size:1.22rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.st dd small{font-size:.75rem;color:var(--muted);font-weight:500;margin-left:2px}
.st dd.txt{font-size:.95rem;padding-top:3px}
.st .sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.sec{margin-top:14px}
.sec h3{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.spark{width:100%;height:64px;display:block}
.spark-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
.lines{font-size:12.5px;margin:6px 0 0;padding:0;list-style:none}
.lines li{margin:2px 0}
.txtsec{font-size:12.5px;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:3px 4px;font-size:10.5px}
.tbl td{text-align:right;padding:3px 4px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.risk td{color:var(--alert)}
.tblwrap{overflow-x:auto}
.alertbox{background:var(--alert-soft);border-radius:9px;padding:9px 11px;font-size:12.5px}
.alertbox h3{color:var(--alert)}
.alertbox ul{margin:0;padding-left:16px}

#help{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:7px 11px;font-size:11.5px;color:var(--muted);max-width:calc(100% - 220px)}
#help b{color:var(--fg);font-weight:600}
.lg{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

#tools{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:3px;padding:4px}
#tools button{width:32px;height:30px;border:0;background:none;border-radius:7px;cursor:pointer;font-size:15px}
#tools button:hover{background:#EFE9DE}
#fps{align-self:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 8px 0 4px;min-width:52px;text-align:right}

#tip{position:absolute;pointer-events:none;background:#2A2724;color:#FBF6EF;font-size:11.5px;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(12px,-120%);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}#tip span{opacity:.7;margin-left:6px}
#err{left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:8px 12px;background:var(--alert-soft);color:var(--alert);font-size:12.5px}

@media (max-width:760px){
  #summary{padding:10px}
  .s-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #top{top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  #card{top:auto;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:62%}
  #help{display:none}
}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Ville 3D de Nuvéa. Le menu « Tous les éléments » ouvre les mêmes cartes au clavier."></canvas>

  <section class="panel" id="summary" aria-label="Résumé">
    <div class="s-head"><span class="s-dot"></span>Nuvéa · 30 derniers jours</div>
    <div class="s-range" id="s-range">Lecture des données…</div>
    <div class="s-kpis">
      <div class="s-kpi"><div class="l">Chiffre d'affaires</div><div class="v" id="k-ca">—</div></div>
      <div class="s-kpi"><div class="l">Clients</div><div class="v" id="k-cl">—</div></div>
      <div class="s-kpi"><div class="l">Panier moyen</div><div class="v" id="k-avg">—</div></div>
      <div class="s-kpi"><div class="l">Alertes</div><div class="v alert" id="k-al">—</div></div>
    </div>
    <div class="s-perso" id="s-perso"></div>
    <p class="s-live" id="s-live"></p>
  </section>

  <div class="panel" id="top">
    <select id="pickEl" aria-label="Ouvrir la carte d'un élément"><option value="">Tous les éléments</option></select>
    <div class="seg" role="group" aria-label="Lumière">
      <button data-light="auto" aria-pressed="true">Auto</button>
      <button data-light="day" aria-pressed="false">Jour</button>
      <button data-light="night" aria-pressed="false">Soir</button>
    </div>
  </div>

  <section class="panel" id="card" aria-live="polite">
    <button id="close" aria-label="Fermer la carte">×</button>
    <div class="eyebrow" id="c-eye"></div>
    <h2 id="c-title"></h2>
    <p class="c-range" id="c-range"></p>
    <dl class="grid" id="c-stats"></dl>
    <div id="c-extra"></div>
  </section>

  <div class="panel" id="help">
    <div><b>Glisser</b> tourner · <b>Clic droit</b> déplacer · <b>Molette</b> zoomer · <b>Clic</b> statistiques</div>
    <div class="lg">Clients : <span><i style="background:var(--morning)"></i>matin</span><span><i style="background:var(--noon)"></i>midi</span><span><i style="background:var(--evening)"></i>après-midi</span></div>
  </div>

  <div class="panel" id="tools" role="group" aria-label="Caméra">
    <button id="rotL" aria-label="Tourner à gauche">⟲</button>
    <button id="rotR" aria-label="Tourner à droite">⟳</button>
    <button id="zout" aria-label="Dézoomer">−</button>
    <button id="zin" aria-label="Zoomer">+</button>
    <button id="home" aria-label="Recentrer">⌂</button>
    <span id="fps" title="Images par seconde (limitées par la fréquence de ton écran)">— fps</span>
  </div>

  <div id="tip"></div>
  <div class="panel" id="err" role="alert" hidden></div>
</div>

<script>
/* =====================================================================
   DONNÉES : /api/stats (Stripe + systeme.io + budget), relu toutes les minutes
   ===================================================================== */
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nf = (n, d) => Number(n).toLocaleString("fr-FR", {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
let CUR = "€";
const money = v => `${nf(v, v % 1 ? 2 : 0)} ${CUR}`;
const eur = v => `${nf(v, 2)} €`;
const dShort = iso => new Date(iso + (iso.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
const dLong = iso => new Date(iso + (iso.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"short"});
const COCKPIT = "Cockpit TIA, relevé du 11 nov. 2026";
const SNAP = "Relevé du 12 nov. 2026, hors Stripe.";
let DATA = null, ITEMS = {}, selected = null;
const SNAPSHOT = window.__SNAPSHOT__ || null; // instantané figé (lien claude.ai), sinon données en direct

function curSymbol(c){
  if (!c) return "€";
  try { return (0).toLocaleString("fr-FR",{style:"currency",currency:c.toUpperCase(),maximumFractionDigits:0}).replace(/[\d\s ,.]/g,"") || c.toUpperCase(); }
  catch { return c.toUpperCase(); }
}
const N = (label, n, unit, sub) => ({label, n:n||0, unit:unit||"", sub});
const T = (label, text, sub) => ({label, text, sub});

function buildItems(d){
  const ok = s => s && s.ok ? s : null;
  const ch = ok(d.charges), pi = ok(d.intents), se = ok(d.sessions), pr = ok(d.products), ba = ok(d.balance), ac = ok(d.account),
        sio = ok(d.systeme), bu = ok(d.budget);
  CUR = curSymbol((ch && ch.currency) || (ba && ba.currency) || (ac && ac.currency));
  const err = s => s && !s.ok ? s.error : null;
  const enCours = (ch ? ch.pending : 0) + (pi ? pi.inProgress : 0);
  const top = se ? se.top : [];
  const formation = top.find(p => /formation|trading/i.test(p.name));
  const bestLines = ch && ch.best
    ? [`Meilleur jour : ${dLong(ch.best.date)}, ${money(ch.best.amount)}`, `Jour le plus calme : ${dLong(ch.calm.date)}, ${money(ch.calm.amount)}`]
    : ["Aucune vente sur la période : pas encore de meilleur jour."];

  let budgetAlerts = [], projRows = null;
  if (bu){
    if (bu.missing.length) budgetAlerts.push(`Charges non renseignées (${bu.missing.length}) : le reste à vivre ne peut pas être calculé.`);
    if (bu.projection){
      projRows = bu.projection;
      const risky = projRows.filter(r => r.epargneUtilisee > 0);
      if (risky.length) budgetAlerts.push(`Épargne entamée dès ${risky[0].mois}.`);
      if (bu.resteAVivre < 0) budgetAlerts.push(`Charges supérieures au salaire de ${eur(-bu.resteAVivre)} par mois.`);
    }
  }
  const sioErr = err(d.systeme);

  return {
    overview:{eyebrow:"Vue d'ensemble", name:"La boutique Nuvéa", range:true, status: ch ? "ok" : "wait",
      stats:[N("Chiffre d'affaires",ch&&ch.gross,CUR,`≈ ${money(ch?ch.gross/30:0)} par jour`), N("Clients",ch&&ch.customers,"",`≈ ${nf((ch?ch.customers:0)/30,1)} par jour`),
        ch && ch.avg !== null ? N("Panier moyen",ch.avg,CUR) : T("Panier moyen","—","Aucune vente à diviser"), N("Commandes en cours",enCours)],
      spark:true, lines:bestLines,
      sections:[{title:"Commandes en cours", text: enCours ? `${enCours} paiement(s) en traitement ou à valider.` : "Aucun paiement en traitement ni à valider dans Stripe."}],
      note: err(d.charges) ? `Stripe : ${err(d.charges)}.` : "Toutes tes ventes Stripe des 30 derniers jours, heure de Paris."},
    tower:{eyebrow:"Produit", name:"Formation Trading IA", range:true, status: se ? "ok" : "wait",
      stats:[N("Chiffre d'affaires",formation&&formation.revenue,CUR), N("Ventes",formation&&formation.qty),
        T("Prix","64 €","Page de vente"), T("Contenu","12 modules","39 leçons")],
      sections:[{title:"Comment c'est compté", text: formation ? `Ventes Checkout du produit « ${formation.name} ».` : "Aucune vente Checkout d'un produit nommé « formation » ou « trading » sur 30 jours."}],
      note:`Prix et contenu : ${COCKPIT}.`},
    shelves:{eyebrow:"Étagères", name:"Packs digitaux", range:true, status: pr ? "ok" : "wait",
      stats:[N("Produits actifs Stripe",pr&&pr.active), N("Ventes Checkout",se&&se.completed),
        pr && pr.stock !== null ? N("Stock suivi",pr.stock,"","metadata.stock") : T("Stock","Illimité","Produits digitaux"), N("CA du n°1",top[0]&&top[0].revenue,CUR)],
      sections:[{title:"Produits les plus vendus", items: top.length ? top.map(p => `${p.name} · ${p.qty} vendu${p.qty>1?"s":""} · ${money(p.revenue)}`) : ["Aucune vente sur 30 jours."]}],
      alerts: pr && pr.active === 0 ? ["Aucun produit actif dans Stripe : la formation est vendue via systeme.io, qui encaisse avec Stripe."] : [],
      note: err(d.products) ? `Stripe : ${err(d.products)}.` : ""},
    counter:{eyebrow:"Comptoir", name:"Caisse Stripe", range:false, status: ac && ac.charges_enabled ? "ok" : "wait",
      stats:[N("Solde disponible",ba&&ba.available,CUR), N("Solde en attente",ba&&ba.pending,CUR),
        N("Remboursé (30 j)",ch&&ch.refunded,CUR), T("Paiements", ac ? (ac.charges_enabled ? "Activés" : "À activer") : "—", ac ? (ac.payouts_enabled ? "Virements activés" : "Virements bloqués") : "")],
      sections:[{title:"Compte", text: ac ? ac.name : "Non lu"}],
      alerts: ac && !ac.charges_enabled ? ["Paiements Stripe pas encore activés."] : [], note:"En direct depuis Stripe."},
    clients:{eyebrow:"Clients", name:"Les clients", range:true, status: ch ? "ok" : "wait",
      stats:[N("Matin",ch&&ch.moments.matin,"","avant 12 h"), N("Midi",ch&&ch.moments.midi,"","12 h – 14 h"),
        N("Après-midi",ch&&ch.moments.soir,"","après 14 h"), sio ? N("Contacts systeme.io",sio.contacts,"",`+${sio.newContacts} en 30 j`) : T("Contacts systeme.io","Non lu")],
      sections:[{title:"Total", text: ch ? `${ch.customers} client${ch.customers>1?"s":""} Stripe, ${ch.count} paiement${ch.count>1?"s":""}.` : "Non lu."},
                {title:"Dans la ville", text: ch && ch.customers ? "Chaque personnage est un client, coloré selon l'heure de son achat." : "Les passants gris sont des visiteurs du quartier, pas des clients : aucun achat sur 30 jours."}]},
    trucks:{eyebrow:"Livraisons", name:"Les camionnettes", range:true, status: se || ch ? "ok" : "wait",
      stats:[N("Livrées",se ? se.completed : ch && ch.count,"","accès envoyés"), N("En cours",enCours), N("Paiements échoués",ch&&ch.failed), N("Paiements abandonnés",pi&&pi.abandoned)],
      sections:[{title:"Comment c'est compté", text:"Une livraison = une session de paiement terminée. L'accès à la formation part automatiquement par email (systeme.io)."}]},
    funnel:{eyebrow:"Tunnel de vente", name:"Porte systeme.io", range:true, status: sio ? "ok" : "wait",
      stats: sio ? [N("Contacts",sio.contacts), N("Nouveaux (30 j)",sio.newContacts), N("Clients (tag CLIENT)",sio.clients,"",`+${sio.newClients} en 30 j`), sio.courses !== null ? N("Formations",sio.courses) : T("Formations","1","Cockpit TIA")]
                 : [T("Contacts","Non lu"), T("Clients","Non lu"), T("Tunnel","6 étapes",COCKPIT), T("Automatisations","1 règle active",COCKPIT)],
      sections:[{title:"Connexion", text: sio ? "systeme.io en direct, lecture seule." : `systeme.io : ${sioErr || "non lu"}.`}],
      alerts: sio ? [] : ["La clé systeme.io est refusée : remplace-la dans les secrets de l'environnement."]},
    home:{eyebrow:"Budget perso", name:"Ta maison", range:false, status: bu ? (budgetAlerts.length ? "wait" : "ok") : "wait",
      stats: bu ? [N("Compte courant",bu.compteCourant,"€"), N("Épargne",bu.epargne,"€"), N("Salaire",bu.salaire,"€",`le ${bu.jourDePaie} du mois`), N("Prochaine paie",bu.daysToPay,"j",dLong(bu.nextPay))]
                : [T("Budget","Non lu")],
      sections: bu ? [
        {title:"Charges mensuelles", items: [...Object.entries(bu.charges).map(([k,v]) => `${k} : ${eur(v)}`), ...bu.missing.map(k => `${k} : à renseigner`)]},
        {title:"Reste à vivre", text: bu.resteAVivre === null ? "Calculé dès que toutes les charges sont renseignées." : `${eur(bu.resteAVivre)} par mois (salaire − charges).`},
        ...(projRows ? [{title:"Projection jusqu'à août", table: projRows}] : [])
      ] : [{title:"Erreur", text: err(d.budget) || "Non lu"}],
      alerts: budgetAlerts, note: bu ? `Source : ${bu.source}.` : ""},
    safe:{eyebrow:"Épargne", name:"Le coffre", range:false, status: bu ? "ok" : "wait",
      stats: bu ? [N("Épargne",bu.epargne,"€"), N("Mois de salaire",bu.epargne/bu.salaire,"","épargne ÷ salaire"),
        bu.chargesTotal ? N("Mois de charges couverts",bu.epargne/bu.chargesTotal) : T("Mois de charges couverts","—","charges à renseigner"),
        N("Total compte + épargne",bu.compteCourant + bu.epargne,"€")] : [T("Épargne","Non lu")],
      sections:[{title:"Réserve de sécurité", text: bu && bu.chargesTotal ? `Ton épargne couvre ${nf(bu.epargne/bu.chargesTotal,1)} mois de charges.` : "Pour savoir combien de mois ton épargne te protège, renseigne tes charges."}],
      note: bu ? `Source : ${bu.source}.` : ""},
    shop:{eyebrow:"Terrasse", name:"Pages de paiement", range:true, status: se ? "ok" : "wait",
      stats:[N("Ouvertes",se&&se.created), N("Terminées",se&&se.completed), N("Conversion",se && se.created ? Math.round(se.completed/se.created*100) : 0,"%"), N("Expirées",se&&se.expired)],
      sections:[{title:"À savoir", text:"Compte les pages de paiement Stripe Checkout. Le bon de commande systeme.io encaisse aussi via Stripe."}]},
    studio:{eyebrow:"Contenu", name:"Studio vidéo", range:false, status:"off",
      stats:[N("Docs scripts et prompts",3), N("Vidéos écrites",52,"","script + description"), T("Plan de publication","Prêt","12 nov."), T("Vues mesurées","Non accessibles")],
      sections:[{title:"Source", text:"Google Drive : « TIA - Scripts et descriptions des vidéos (52…) », « TIA - Plan de publication », « TIA - Calendrier de publication (v2) »."}], note:SNAP},
    tiktok:{eyebrow:"Audience", name:"Antenne TikTok", range:false, status:"off",
      stats:[N("Comptes publicitaires",0), N("Business Centers",0), N("Dépense pub",0,"€"), T("Vues organiques","Non accessibles")],
      alerts:["Aucun compte publicitaire TikTok relié."], note:SNAP},
    mail:{eyebrow:"Courrier", name:"Boîte mail", range:false, status:"off",

    if (has && !markers[id]){ const s = new THREE.Sprite(ALERT_MAT); s.scale.set(1.1, 1.1, 1.1); s.position.set(...ALERT_AT[id]); s.renderOrder = 10; scene.add(s); markers[id] = s; }
    if (!has && markers[id]){ scene.remove(markers[id]); delete markers[id]; }
  }
}
function updateWorld(d){ buildClients(d); updateAlerts(); }

/* =====================================================================
   LUMIÈRE : jour / soir, allumage progressif des fenêtres
   ===================================================================== */
let lightMode = "auto";
const parisHour = () => +new Intl.DateTimeFormat("fr-FR", {timeZone:"Europe/Paris", hour:"2-digit", hourCycle:"h23"}).format(new Date());
const isNight = () => lightMode === "night" || (lightMode === "auto" && (parisHour() >= 19 || parisHour() < 7));
document.querySelectorAll("[data-light]").forEach(b => b.onclick = () => { lightMode = b.dataset.light;
  document.querySelectorAll("[data-light]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
const hl = lin(0xD97757);
let nightK = isNight() ? 1 : 0;
function paint(t, dt){
  const target = isNight() ? 1 : 0; nightK += (target - nightK) * Math.min(1, dt*2.5);
  $("app").classList.toggle("night", target === 1);
  hemi.intensity = .95 - .65*nightK; sun.intensity = 2.3 - 1.95*nightK; fill.intensity = .35 + .25*nightK;
  sun.color.setRGB(1, .92 - .15*nightK, .82 - .1*nightK);
  const wake = reduce ? 1 : Math.min(1, Math.max(0, (t - .6) / 1.2));
  const warm = (.18 + .9*nightK) * wake;
  glassWarm.emissive.setRGB(1*warm, .62*warm, .3*warm);
  houseGlass.forEach((m, i) => { const k = nightK * ((i * 7) % 5 > 1 ? .85 : .05) * (reduce ? 1 : Math.min(1, Math.max(0, t - .4 - i*.08))); m.emissive.setRGB(1*k, .62*k, .3*k); });
  const lk = .2 + .9*nightK; lampMat.emissive.setRGB(lk, .75*lk, .45*lk);
  pick.forEach(m => {
    if (!m.userData.own || !m.material.emissive) return;
    const on = m.userData.id === selected, hov = m.userData.id === hovered;
    if (on) m.material.emissive.copy(hl).multiplyScalar(.22 * (reduce ? 1 : .7 + .3*Math.sin(t*3)));
    else if (hov) m.material.emissive.copy(hl).multiplyScalar(.12);
    else m.material.emissive.setRGB(0, 0, 0);
  });
  for (const id in markers) markers[id].position.y = ALERT_AT[id][1] + (reduce ? 0 : Math.sin(t*2.4)*.18);
}

/* =====================================================================
   CAMÉRA, INTERACTION, ANIMATION
   ===================================================================== */
function resize(){ const w = innerWidth, h = innerHeight, half = w < 700 ? 22 : 17, a = w / h;
  renderer.setSize(w, h, false); cam.left = -half*a; cam.right = half*a; cam.top = half; cam.bottom = -half; cam.updateProjectionMatrix(); }
addEventListener("resize", resize);
let camAnim = null;
function tween(target, zoom, pos){ const to = {t:target.clone(), z:zoom, p:pos ? pos.clone() : null};
  if (reduce){ controls.target.copy(to.t); cam.zoom = to.z; if (to.p) cam.position.copy(to.p); cam.updateProjectionMatrix(); return; }
  camAnim = {t0:performance.now(), fT:controls.target.clone(), fZ:cam.zoom, fP:cam.position.clone(), ...to}; }
function focusOn(id){ const c0 = focusCenter[id]; if (!c0) return; const c = c0.clone();
  tween(c, Math.max(cam.zoom, 2.1), c.clone().add(cam.position.clone().sub(controls.target))); }
function orbit(angle){ const off = cam.position.clone().sub(controls.target); off.applyAxisAngle(new THREE.Vector3(0,1,0), angle); tween(controls.target, cam.zoom, controls.target.clone().add(off)); }
$("rotL").onclick = () => orbit(Math.PI/4); $("rotR").onclick = () => orbit(-Math.PI/4);
$("zin").onclick = () => tween(controls.target, Math.min(controls.maxZoom, cam.zoom*1.3));
$("zout").onclick = () => tween(controls.target, Math.max(controls.minZoom, cam.zoom/1.3));
$("home").onclick = () => { closeCard(); tween(HOME.target, HOME.zoom, HOME.pos); };

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), tip = $("tip");
let hovered = null, down = null;
function hit(e){ ptr.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1); ray.setFromCamera(ptr, cam);
  const h = ray.intersectObjects(pick, false)[0]; return h ? h.object.userData.id : null; }
canvas.addEventListener("pointerdown", e => { down = {x:e.clientX, y:e.clientY, b:e.button}; canvas.classList.add("drag"); tip.classList.remove("on"); });
let pendingMove = null;
canvas.addEventListener("pointermove", e => { if (!down) pendingMove = e; });
function handleHover(e){
  const id = hit(e); hovered = id; canvas.classList.toggle("over", !!id);
  if (id && ITEMS[id] && ITEMS[id].name){ tip.innerHTML = `${esc(ITEMS[id].name)}<span>${esc(ITEMS[id].eyebrow)}</span>`; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("on"); }
  else tip.classList.remove("on"); }
canvas.addEventListener("pointerup", e => { canvas.classList.remove("drag");
  if (down && down.b === 0 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6){ const id = hit(e); id ? openCard(id) : closeCard(); } down = null; });
canvas.addEventListener("pointerleave", () => { hovered = null; tip.classList.remove("on"); });
canvas.addEventListener("contextmenu", e => e.preventDefault());

// camionnettes : boucle sur les rues, voie de droite
const LANE = .8, A0 = ST[0] + LANE, A1 = ST[1] - LANE, loop = [[A0, A0],[A1, A0],[A1, A1],[A0, A1]];
const segs = r => r.map((p, i) => { const q = r[(i+1) % r.length]; return Math.hypot(q[0]-p[0], q[1]-p[1]); });
const loopS = segs(loop), loopT = loopS.reduce((a,b) => a+b, 0);
function onLoop(path, s, total, u){ let d = ((u % 1) + 1) % 1 * total, i = 0; while (d > s[i]){ d -= s[i]; i++; }
  const p = path[i], q = path[(i+1) % path.length], f = d/s[i]; return {x:p[0] + (q[0]-p[0])*f, z:p[1] + (q[1]-p[1])*f, a:Math.atan2(-(q[1]-p[1]), q[0]-p[0])}; }
// promenades sur les trottoirs, et file des clients vers la porte de la boutique
const routes = [[[-12.3,-12.3],[12.3,-12.3],[12.3,12.3],[-12.3,12.3]], [[-7.6,8.6],[7.6,8.6],[7.6,9.4],[-7.6,9.4]], [[11.5,11.5],[4.5,9],[2.6,3.6],[4.5,9]]]
  .map(r => { const s = segs(r); return {r, s, t:s.reduce((a,b) => a+b, 0)}; });

let last = performance.now(); const t0 = last;
function frame(now){
  const t = (now - t0)/1000, dt = Math.min(.1, (now - last)/1000); last = now;
  if (camAnim){ const p = Math.min(1, (now - camAnim.t0)/750), e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    controls.target.lerpVectors(camAnim.fT, camAnim.t, e); cam.zoom = camAnim.fZ + (camAnim.z - camAnim.fZ)*e; cam.updateProjectionMatrix();
    if (camAnim.p) cam.position.lerpVectors(camAnim.fP, camAnim.p, e); if (p >= 1) camAnim = null; }
  trucks.forEach(tr => { const s = onLoop(loop, loopS, loopT, (reduce ? 0 : t*.016) + tr.userData.offset);
    tr.position.set(s.x, .14 + (reduce ? 0 : Math.abs(Math.sin(t*10 + tr.userData.offset*9))*.015), s.z); tr.rotation.y = s.a; });
  people.forEach(p => { const w = p.userData.walk, R = routes[w.route];
    const s = onLoop(R.r, R.s, R.t, reduce ? w.ph : (t*(w.route === 2 ? .035 : .012) + w.ph));
    p.position.set(s.x + (w.route ? w.lane : 0), groundTop, s.z + (w.route ? 0 : w.lane)); p.rotation.y = s.a + Math.PI/2;
    if (!reduce) p.userData.legs.forEach((l, k) => l.rotation.x = Math.sin(t*7 + w.ph*10 + k*Math.PI)*.45); });
  if (pendingMove){ handleHover(pendingMove); pendingMove = null; }
  paint(t, dt); controls.update(); renderer.render(scene, cam);
  // compteur fps et résolution adaptative : on baisse la netteté si la machine n'arrive pas à suivre
  fpsN++; fpsAcc += (now - fpsLast) / 1000; fpsLast = now;
  if (fpsAcc >= 1){ const fps = fpsN / fpsAcc; $("fps").textContent = `${Math.round(fps)} fps`;
    if (fps < 50 && dpr > 1){ dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); resize(); }
    fpsN = 0; fpsAcc = 0; }
  requestAnimationFrame(frame);
}
let fpsN = 0, fpsAcc = 0, fpsLast = performance.now(), dpr = Math.min(devicePixelRatio, 2);

/* --- Fusion du décor : des milliers d'objets ramenés à quelques dizaines d'appels de dessin --- */
const focusCenter = {};
function bakeStatic(){
  scene.updateMatrixWorld(true);
  for (const id in groups) if (id !== "trucks" && id !== "clients") focusCenter[id] = new THREE.Box3().setFromObject(groups[id]).getCenter(new THREE.Vector3());
  const dynamic = new Set(); [groups.trucks, groups.clients].forEach(g => g.traverse(o => dynamic.add(o)));
  const buckets = new Map(), victims = [];
  scene.traverse(o => {
    if (!o.isMesh || dynamic.has(o)) return;
    const id = o.userData.id || "", key = `${id}|${o.material.uuid}|${o.castShadow ? 1 : 0}|${o.renderOrder}`;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    Object.keys(g.attributes).forEach(k => { if (!["position", "normal", "uv"].includes(k)) g.deleteAttribute(k); });
    if (!g.attributes.uv) g.setAttribute("uv", new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    g.clearGroups(); g.morphAttributes = {};
    if (!buckets.has(key)) buckets.set(key, {geos:[], mat:o.material, id, cast:o.castShadow, own:o.userData.own, ro:o.renderOrder});
    buckets.get(key).geos.push(g); victims.push(o);
  });
  victims.forEach(o => o.parent.remove(o));
  pick.length = 0;
  buckets.forEach(b => {
    const m = new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(b.geos), b.mat);
    m.castShadow = b.cast; m.receiveShadow = true; m.renderOrder = b.ro; m.matrixAutoUpdate = false;
    if (b.id){ m.userData.id = b.id; m.userData.own = b.own; pick.push(m); }
    scene.add(m);
  });
  renderer.shadowMap.needsUpdate = true;
}

ITEMS = Object.fromEntries(ORDER.map(id => [id, {status:"off"}]));
bakeStatic(); buildClients(null); renderer.setPixelRatio(dpr); resize(); requestAnimationFrame(frame);
refresh(); if (!SNAPSHOT) setInterval(refresh, 60000);
</script>
</body>
